# Configuration for the CPDLC plugin.

# The address of the hub on the CPDLC server
ServerEndpoint: "https://vatpac-cpdlc.eoinmotherway.dev/hubs/controller"

# When true, the plugin connects to the CPDLC server when vatSys connects to VATSIM.
# It uses the first station in Stations.
AutoConnect: false

# The stations that the controller can select
Stations: [YBBB, YMMM, NFFF, AYPM]

LogLevel: Verbose
MaxCurrentMessages: 50
MaxArchivedMessages: 50
MaxDisplayMessageLength: 40
MaxExtendedMessageLength: 80

# The Current Messages window shows "!" for a downlink that has one of these elements
FlaggedElementIds:
  - DM29  # CLIMBING TO [altitude]
  - DM30  # DESCENDING TO [altitude]
  - DM80  # DEVIATING [distance offset] [direction] OF ROUTE

# Maps ATSU codes to the sectors they cover (as reported by vatSys SectorsVolumes).
# Used to find the Next Data Authority along the FDR route.
AtsuCodes:
  - AtsuCode: YBBB
    Sectors: [INL, DOS, SDY, BUR, GOL, NSA, ARL, MDE, MLD, OCN, MNN, CNK, KPL, CVN, SWY, KEN, BAR, TBP, WIL, ISA, WEG, ARA, STR, TRT, KIY, ASH, TRS, TSN, HWE, FLD, COL]
  - AtsuCode: YMMM
    Sectors: [GUN, KAT, BIK, WOL, SNO, BLA, ELW, HUO, WON, MUN, YWE, OXL, GTH, TBD, AUG, ASP, FOR, WAR, ASW, WRA, BKE, ESP, HYD, JAR, PIY, SCR, GVE, GEL, LEA, OLW, POT, PAR, MEK, MTK, NEW, MZI, IND, INE, INS]
  - AtsuCode: NZZO
    Sectors: [NZZO, NZZOT]
  - AtsuCode: NZCM
    Sectors: [NZCM]
  - AtsuCode: FAJO
    Sectors: [FAJO]
  - AtsuCode: FIMM
    Sectors: [FIMM, FIMMU]
  - AtsuCode: VRMF
    Sectors: [VRMF]
  - AtsuCode: VCCF
    Sectors: [VCCF]
  - AtsuCode: WIIF
    Sectors: [WIIF, WIIFSG, WIIFBD, WIIFMN, WIIFIS]
  - AtsuCode: WAAF
    Sectors: [WAAF, UBLI, WAAFNA, WAAFAN, WAAFPA]
  - AtsuCode: NFFF
    Sectors: [NFFF]
  - AtsuCode: AYPM
    Sectors: [AYPM]
  - AtsuCode: KZAK
    Sectors: [KZAK, KZAKE, KZAKW, KZAK3, KZAK5, KZAK6, KZAK9]
  - AtsuCode: ASIW
    Sectors: [ASIAW]
  - AtsuCode: ASEA
    Sectors: [ASEA]
  - AtsuCode: AFRS
    Sectors: [AFRS]

# The uplink elements that the editor shows.
# Element is the FANS 1/A uplink element, for example UM20.
# DefaultParameters gives values for the parameters. The names come from the element, for example "altitude".
# If a type occurs more than one time in an element, the names have a number, for example "altitude1" and "altitude2".
# A default value can use these variables from the FDR of the aircraft.
# A variable is empty if the FDR has no value for it.
#   $Callsign         The callsign, for example "QFA1"
#   $AircraftType     The aircraft type, for example "B744"
#   $Departure        The departure airport, for example "YSSY"
#   $Destination      The destination airport, for example "WSSS"
#   $AssignedSsrCode  The assigned SSR code, for example "3000"
#   $RequestedLevel   The requested level in hundreds of feet, for example "350" or "095"
#   $ClearedLevel     The cleared level in hundreds of feet, for example "350" or "095".
#                     It is empty for a block level.
#   $NextWaypoint     The next waypoint in the route, for example "TAXEG"
UplinkMessages:
  # The transition level in feet. The editor shows levels as three digits, for example "350".
  # In the uplink text, a level below the transition level is an altitude, for example "A095",
  # and a level at or above it is a flight level, for example "F350".
  TransitionLevel: 11000

  # The values that the controller can select for an [icao unit name] parameter
  IcaoUnitNames:
    - BRISBANE CTR
    - MELBOURNE CTR
    - NADI CTL
    - MORESBY CTL
    - AUCKLAND RDO
    - MCMURDO RDO
    - JOHANNESBURG CTL
    - MAURITIUS CTL
    - MALE CTL
    - COLOMBO CTL
    - JAKARTA CTR
    - MAKASSAR CTR
    - OAKLAND CTR
    - WEST ASIA CTL
    - SOUTH EAST ASIA CTL
    - SOUTH AFRICA CTL

  QuickAccessMessages:
    - Element: UM147  # REQUEST POSITION REPORT
    - Element: UM123  # SQUAWK [beacon code]
      DefaultParameters:
        beaconCode: "$AssignedSsrCode"
    - Element: UM169  # [free text]
      DefaultParameters:
        freeText: "REQUEST RECEIVED, RESPONSE WILL BE VIA VOICE"
    - Element: UM121  # AT [position] MONITOR [icao unit name] [frequency]
    - Element: UM118  # AT [position] CONTACT [icao unit name] [frequency]
    - Element: UM161  # END SERVICE
    - Element: UM20  # CLIMB TO AND MAINTAIN [altitude]
      DefaultParameters:
        altitude: "$ClearedLevel"
    - Element: UM129  # REPORT LEVEL [altitude]

  Groups:
    - Name: "LEVEL"
      Messages:
        - Element: UM19  # MAINTAIN [altitude]
          DefaultParameters:
            altitude: "$ClearedLevel"
        - Element: UM20  # CLIMB TO AND MAINTAIN [altitude]
          DefaultParameters:
            altitude: "$ClearedLevel"
        - Element: UM164  # WHEN READY
        - Element: UM26  # CLIMB TO REACH [altitude] BY [time]
          DefaultParameters:
            altitude: "$ClearedLevel"
        - Element: UM27  # CLIMB TO REACH [altitude] BY [position]
          DefaultParameters:
            altitude: "$ClearedLevel"
        - Element: UM129  # REPORT LEVEL [altitude]
        - Element: UM23  # DESCEND TO AND MAINTAIN [altitude]
          DefaultParameters:
            altitude: "$ClearedLevel"
        - Element: UM28  # DESCEND TO REACH [altitude] BY [time]
          DefaultParameters:
            altitude: "$ClearedLevel"
        - Element: UM29  # DESCEND TO REACH [altitude] BY [position]
          DefaultParameters:
            altitude: "$ClearedLevel"
        - Element: UM128  # REPORT LEAVING [altitude]
        - Element: UM135  # CONFIRM ASSIGNED ALTITUDE
        - Element: UM171  # CLIMB AT [vertical rate] MINIMUM
        - Element: UM172  # CLIMB AT [vertical rate] MAXIMUM
        - Element: UM173  # DESCEND AT [vertical rate] MINIMUM
        - Element: UM174  # DESCEND AT [vertical rate] MAXIMUM
        - Element: UM36  # EXPEDITE CLIMB TO [altitude]
          DefaultParameters:
            altitude: "$ClearedLevel"
        - Element: UM37  # EXPEDITE DESCENT TO [altitude]
          DefaultParameters:
            altitude: "$ClearedLevel"
        - Element: UM38  # IMMEDIATELY CLIMB TO [altitude]
          DefaultParameters:
            altitude: "$ClearedLevel"
        - Element: UM39  # IMMEDIATELY DESCEND TO [altitude]
          DefaultParameters:
            altitude: "$ClearedLevel"
    - Name: "ROUTE"
      Messages:
        - Element: UM137  # CONFIRM ASSIGNED ROUTE
        - Element: UM74  # PROCEED DIRECT TO [position]
        - Element: UM77  # AT [position] PROCEED DIRECT TO [position]
        - Element: UM79  # CLEARED TO [position] VIA [route clearance]
        - Element: UM83  # AT [position] CLEARED [route clearance]
