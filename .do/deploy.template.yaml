spec:
  name: cpdlc-server
  # App Platform has no persistent disk, so the server keeps its data in a PostgreSQL database
  databases:
    - name: db
      engine: PG
      production: false
  services:
    - name: cpdlc-server
      instance_count: 1
      instance_size_slug: basic-xxs
      dockerfile_path: source/CPDLCServer/Dockerfile
      github:
        repo: YuKitsune/CPDLCPlugin
        branch: main
        deploy_on_push: true
      http_port: 8080
      envs:
        - key: Logging__Level
          value: Information
        - key: DatabaseProvider
          value: PostgreSql
        - key: DatabaseConnectionString
          scope: RUN_TIME
          value: ${db.DATABASE_URL}
        # You must set the master key before you deploy. Without it, the server does not start.
        # Make a key with: openssl rand -base64 32
        # Keep a copy of the key in a safe place. If the key changes, you must enter the ACARS authentication codes again.
        - key: MasterKey
          scope: RUN_TIME
          type: SECRET
          value: ""
