spec:
  name: cpdlc-server
  # App Platform has no persistent disk, so the server keeps its data in a PostgreSQL database
  databases:
    - name: db
      engine: PG
      production: false
  services:
    - name: cpdlc-server
      instance_count: 1
      instance_size_slug: basic-xxs
      dockerfile_path: source/CPDLCServer/Dockerfile
      github:
        repo: YuKitsune/CPDLCPlugin
        branch: main
        deploy_on_push: true
      http_port: 8080
      envs:
        - key: Logging__Level
          value: Information
        - key: DatabaseProvider
          value: PostgreSql
        - key: DatabaseConnectionString
          scope: RUN_TIME
          value: ${db.DATABASE_URL}
        
        # You must set the master key before you deploy. Without it, the server does not start.
        # Make a key with: openssl rand -base64 32
        # Keep a copy of the key in a safe place. If the key changes, you must enter the ACARS authentication codes again.
        - key: MasterKey
          scope: RUN_TIME
          type: SECRET
          value: ""
        
        # BuiltIn or VATSIM. Without it, the server does not start.
        # BuiltIn: administrators log in with their CID and a password. The setup URL with its token is in the log.
        # VATSIM: all users log in with VATSIM Connect. Then set the client below.
        - key: AuthType
          scope: RUN_TIME
          value: "VATSIM"

        # With AuthType VATSIM, you must set the VATSIM Connect client before you deploy. Without it, the server does not start.
        # Set the redirect URL of the client to https://<app URL>/signin-vatsim
        - key: VatsimConnect__ClientId
          scope: RUN_TIME
          value: ""
        - key: VatsimConnect__ClientSecret
          scope: RUN_TIME
          type: SECRET
          value: ""
